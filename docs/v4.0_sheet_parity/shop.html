<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Ledger - Manifest I.XX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;0,900;1,400&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        :root {
            --parchment: #f4e4bc;
            --ink: #2c1e1a;
            --wood-dark: #3e2723;
            --wood-light: #5d4037;
        }

        body {
            background-color: #1a1a14;
            background-image: radial-gradient(circle at center, #2a2a20 0%, #1a1a14 100%);
            color: var(--wood-dark);
            font-family: 'Crimson Pro', serif;
            min-height: 100vh;
            margin: 0;
        }

        .fantasy-font { font-family: 'MedievalSharp', cursive; }
        .ledger-font { font-family: 'Crimson Pro', serif; }

        .parchment {
            background-color: var(--parchment);
            background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0) 100%), url("https://www.transparenttextures.com/patterns/p6.png");
            border: 1px solid #d2b48c;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.1), 5px 5px 15px rgba(0,0,0,0.3);
        }

        .wood-border {
            border: 8px solid var(--wood-dark);
            border-image: linear-gradient(to bottom, var(--wood-light), var(--wood-dark)) 1;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #8b451344; border-radius: 10px; }

        .btn-store {
            transition: all 0.2s ease;
            opacity: 0.6;
        }
        .btn-store.active {
            opacity: 1;
            transform: scale(1.05);
            background-color: rgba(255,255,255,0.4);
            border: 2px solid #8b4513;
        }

        .ink-text {
            color: var(--ink);
            text-shadow: 0.5px 0.5px 0px rgba(0,0,0,0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-flow { animation: fadeIn 0.3s ease-out forwards; }

        @media print {
            body { background: white !important; color: black !important; padding: 0; }
            .no-print, button, input, #store-selector, #item-search, .buy-sell-toggle { display: none !important; }
            .parchment { box-shadow: none !important; border: 1px solid #8b4513 !important; }
            .wood-border { border: none !important; }
            #ledger-items { overflow: visible !important; height: auto !important; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- LEFT PANEL: Selection -->
    <div class="lg:col-span-5 xl:col-span-4 flex flex-col gap-6 no-print">
        
        <!-- Search Bar -->
        <div class="relative z-50 group">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-[#8b4513] opacity-60" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <input type="text" id="item-search" placeholder="Search the Imperial Registry..." class="w-full bg-[#f4e4bc] border-4 border-double border-[#8b4513] pl-10 p-3 rounded text-[#5d4037] font-bold ledger-font placeholder:text-[#8b4513]/50 focus:outline-none focus:bg-[#fff9e6] transition-colors shadow-inner text-lg" oninput="handleSearch(this.value)">
            <div id="search-results" class="absolute w-full mt-1 bg-[#f4e4bc] border-2 border-[#8b4513] rounded shadow-2xl hidden max-h-72 overflow-y-auto custom-scrollbar z-50">
                <!-- Results injected by JS -->
            </div>
        </div>

        <!-- Store Selector -->
        <div class="parchment p-4 rounded border-double border-4 border-[#8b4513] relative z-40">
            <h3 class="fantasy-font text-xs uppercase tracking-widest mb-3 text-[#8b4513] border-b border-[#d2b48c] pb-2 text-center">Imperial Trade Venues</h3>
            <div id="store-selector" class="grid grid-cols-3 lg:grid-cols-5 gap-2">
                <!-- Stores injected by JS -->
            </div>
        </div>

        <!-- Structured Order Entry -->
        <div class="parchment p-6 rounded relative overflow-hidden flex-1 max-h-[750px] overflow-y-auto custom-scrollbar z-30">
            <div id="entry-container" class="animate-flow">
                <!-- Selection Flow injected by JS -->
            </div>
        </div>

        <!-- Buy/Sell Toggle -->
        <div class="bg-[#2c1e1a] p-1 rounded-lg wood-border grid grid-cols-3 gap-1 z-20 buy-sell-toggle">
            <button onclick="setTradeMode('sale')" id="mode-sale" class="py-4 rounded font-bold fantasy-font text-[10px] bg-[#f4e4bc] text-[#2c1e1a] transition-all shadow-md">Imperial Sale</button>
            <button onclick="setTradeMode('buyback')" id="mode-buy" class="py-4 rounded font-bold fantasy-font text-[10px] text-[#f4e4bc]/40 transition-all hover:bg-[#f4e4bc]/10">Citizen Buyback</button>

        </div>
    </div>

    <!-- RIGHT PANEL: Great Ledger -->
    <div class="lg:col-span-7 xl:col-span-8">
        <div class="bg-[#3e2723] rounded-xl shadow-2xl p-2 wood-border h-full">
            <div class="parchment rounded-sm p-6 md:p-10 h-full flex flex-col relative">
                
                <div class="flex justify-between items-end border-b-4 border-double border-[#8b4513] pb-6 mb-6">
                    <div>
                        <h1 class="fantasy-font text-4xl tracking-tighter ink-text mb-1 uppercase">Great Ledger of Trade</h1>
                        <p class="ledger-font italic opacity-60 text-sm">Imperial Manifest I.XX • Treasury Records</p>
                    </div>
                    <div class="flex gap-2 no-print">
                        <button onclick="sealAndPrint()" class="fantasy-font text-[10px] bg-[#8b4513] text-[#f4e4bc] px-4 py-2 rounded hover:bg-[#5d4037] transition-colors shadow-md">Seal & Export</button>
                        <button onclick="clearLedger()" class="fantasy-font text-[10px] text-[#8b4513] border border-[#8b4513]/20 px-4 py-2 rounded hover:bg-[#8b4513]/10 transition-colors">Purge Ledger</button>
                    </div>
                </div>

                <!-- Encumbrance Bar -->
                <div class="mb-6">
                    <div class="flex justify-between items-center mb-1">
                        <span class="fantasy-font text-[10px] uppercase opacity-60 tracking-widest">Weight & Encumbrance</span>
                        <span id="weight-label" class="ledger-font font-bold text-xs">0.0 kg</span>
                    </div>
                    <div class="w-full bg-[#8b4513]/10 h-3 rounded-full overflow-hidden border border-[#8b4513]/20 flex">
                        <div id="weight-bar" class="bg-[#8b4513] h-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                    <p id="encumbrance-warning" class="fantasy-font text-[10px] mt-1 italic text-[#8b4513] opacity-60">Manifest is easily carried by hand.</p>
                </div>

                <!-- Ledger Items -->
                <div id="ledger-items" class="flex-1 overflow-y-auto space-y-4 pr-2 custom-scrollbar min-h-[400px]">
                    <!-- Items injected by JS -->
                </div>

                <!-- Totals Section -->
                <div class="mt-8 pt-6 border-t-4 border-double border-[#8b4513]">
                    <div class="flex flex-col xl:flex-row justify-between items-end gap-6">
                        <div class="flex-1">
                            <span class="fantasy-font text-xs uppercase opacity-40 mb-1 block tracking-widest">Sum Total of manifest</span>
                            <div id="manifest-total" class="fantasy-font text-6xl leading-none ink-text">0cp</div>
                        </div>
                        <div id="coin-entry" class="flex gap-2 no-print"></div>
                    </div>

                    <!-- Change Due -->
                    <div id="change-container" class="hidden mt-6 p-4 bg-[#2c1e1a] rounded text-[#f4e4bc] flex justify-between items-center border-2 border-[#8b4513]">
                        <div>
                            <span class="fantasy-font text-[10px] uppercase block opacity-60 tracking-widest">Citizen Reimbursement</span>
                            <span id="change-text" class="fantasy-font text-3xl">0cp</span>
                        </div>
                        <div id="change-coins" class="flex flex-wrap gap-1 justify-end max-w-[60%]"></div>
                    </div>
                </div>

                <div class="hidden print:block mt-20 pt-10 border-t border-dashed border-[#8b4513] text-center">
                    <p class="fantasy-font text-sm opacity-40 italic">Sealed by Imperial Decree • All Wares Checked and Verified</p>
                    <div class="mt-4 flex justify-center opacity-30">
                        <div class="w-16 h-16 border-4 border-[#8b4513] rounded-full flex items-center justify-center font-bold text-2xl">IM</div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

    /** ENGINE **/
    function formatCp(cp) {
        let rem = Math.abs(cp);
        const parts = [];
        COIN_TYPES.forEach(c => {
            const count = Math.floor(rem / c.value);
            if (count > 0) { parts.push(`${count}${c.name[0].toLowerCase()}`); rem %= c.value; }
        });
        return (cp < 0 ? '-' : '') + (parts.length > 0 ? parts.join(' ') : '0cp');
    }

    function getMatVal(mat, q) {
        if (!mat) return 0;
        if (mat.type === 'tiered_bone') return [50, 100, 200, 350, 500][q-1] || 50;
        if (mat.type === 'linear') return mat.base + (q-1) * (mat.step || 0);
        if (mat.type === 'tiered' && q === 10) return mat.q10 || (mat.base * 10);
        if (mat.type === 'tiered') return mat.base * q;
        if (mat.type === 'fixed') return mat.base;
        return mat.base;
    }

    function applyMarkup(price) {
        if (currentMarkup === 0) return price;
        return Math.max(1, Math.ceil(price * (1 + (currentMarkup / 100))));
    }

    function calculateBreakdown(item, mats, inlay, flags) {
        const layers = [];
        const baseMat = mats[0];
        
        let basePrice = 0;
        if (item.value) {
            basePrice = item.value;
        } else {
            if (!flags.primary) {
                basePrice = Math.ceil(item.weight * getMatVal(baseMat.mat, baseMat.q));
                if (baseMat.mat && baseMat.mat.type === 'fixed') {
                    basePrice += baseMat.mat.base;
                }
            }
        }

        layers.push({ name: baseMat.mat ? baseMat.mat.name : 'Standard', price: basePrice, type: 'Primary' });

        for(let i=1; i<mats.length; i++) {
            const m = mats[i].mat;
            const isProvided = (i === 1) ? flags.secondary : false;

            if(m && m.id && m.id.startsWith('st_')) {
                layers.push({ name: m.name, price: m.base, type: 'Condition' });
            } else if (m) {
                const secondaryVal = isProvided ? 0 : (m.type === 'fixed' ? m.base : Math.ceil((item.weight * 0.20) * getMatVal(m, 1)));
                layers.push({ name: m.name + (isProvided ? ' (Provided)' : ''), price: secondaryVal, type: 'Secondary' });
            }
        }
        
        if (inlay) {
            layers.push({ name: `${inlay.name} Inlay${flags.inlay ? ' (Provided)' : ''}`, price: flags.inlay ? 0 : inlay.price, type: 'Inlay' });
        }

        const labor = item.value ? 0 : Math.ceil(item.hours * 20);
        let total = layers.reduce((s, l) => s + l.price, 0) + labor;
        
        total = Math.max(1, total); 
        return { total: applyMarkup(total), layers, labor };
    }

    function calculateRecraftBreakdown(item, origMats, newMats, oInlay, nInlay, flags) {
        let totalMatDiff = 0;
        let hours = 0;

        const origBase = origMats[0].mat; const origQ = origMats[0].q;
        const newBase = newMats[0].mat; const newQ = newMats[0].q;
        
        if (origBase && newBase) {
            let origBasePrice = getMatVal(origBase, origQ) * item.weight + (origBase.type === 'fixed' ? origBase.base : 0);
            let newBasePrice = flags.primary ? 0 : getMatVal(newBase, newQ) * item.weight + (newBase.type === 'fixed' ? newBase.base : 0);
            
            if (origBase.id !== newBase.id) {
                totalMatDiff += Math.max(0, newBasePrice - origBasePrice);
                hours += item.hours;
            } else if (origQ !== newQ) {
                totalMatDiff += Math.max(0, newBasePrice - origBasePrice);
                hours += Math.ceil(item.hours * 0.5);
            }
        }

        const origSec = origMats[1].mat; const newSec = newMats[1].mat;
        if (origSec?.id !== newSec?.id) {
            let origSecPrice = origSec ? (origSec.type === 'fixed' ? origSec.base : (item.weight * 0.2) * getMatVal(origSec, 1)) : 0;
            let newSecPrice = newSec ? (flags.secondary ? 0 : (newSec.type === 'fixed' ? newSec.base : (item.weight * 0.2) * getMatVal(newSec, 1))) : 0;
            totalMatDiff += Math.max(0, newSecPrice - origSecPrice);
            hours += Math.ceil(item.hours * 0.3);
        }

        const origCond = origMats[2].mat; const newCond = newMats[2].mat;
        if (origCond?.id !== newCond?.id) {
            let origCondPrice = origCond ? origCond.base : 0;
            let newCondPrice = newCond ? newCond.base : 0;
            totalMatDiff += Math.max(0, newCondPrice - origCondPrice);
            hours += Math.ceil(item.hours * 0.2);
        }

        if (oInlay?.id !== nInlay?.id) {
            let origInlayPrice = oInlay ? oInlay.price : 0;
            let newInlayPrice = nInlay ? (flags.inlay ? 0 : nInlay.price) : 0;
            totalMatDiff += Math.max(0, newInlayPrice - origInlayPrice);
            hours += 2; // Flat 2 hours for inlay work
        }

        hours = Math.max(0, Math.min(hours, item.hours * 1.5));
        let laborCost = Math.ceil(hours * 200); 
        let total = totalMatDiff + laborCost;

        return { total: applyMarkup(total), labor: laborCost, hours };
    }

            const cats = [...new Set(ITEMS.filter(i => i.store === activeStoreId).map(i => i.category))].sort();
            html += `<div class="grid grid-cols-1 gap-2">${cats.map(c => {
                const escapedCat = c.replace(/'/g, "\\'");
                return `<button onclick="setCat('${escapedCat}')" class="p-4 bg-white/40 border-2 border-[#8b4513]/10 rounded hover:border-[#8b4513] transition-all fantasy-font uppercase tracking-widest text-sm text-left pl-6 font-bold text-[#3e2723] hover:bg-[#fff9e6] shadow-sm">${c}</button>`;
            }).join('')}</div>`;
        } else if (!selectedBaseItem) {
            html += `<button onclick="setCat(null)" class="text-[10px] fantasy-font mb-4 opacity-50 uppercase tracking-tighter hover:opacity-100 transition-opacity">← Categories</button>`;
            const items = ITEMS.filter(i => i.store === activeStoreId && i.category === currentCategory).sort((a,b) => a.name.localeCompare(b.name));
            html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-2">${items.map(i => `
                <button onclick="setItem('${i.id}')" class="p-3 bg-white/40 border border-[#8b4513]/10 rounded hover:border-[#8b4513] text-sm ledger-font font-bold flex flex-col text-left transition-all hover:bg-[#fff9e6] shadow-sm">
                    <span>${i.name}</span>
                    <span class="opacity-40 text-xs italic">${i.value !== undefined ? formatCp(i.value) : i.weight + 'kg'}</span>
                </button>
            `).join('')}</div>`;
        } else {
            html += `<button onclick="setItem(null)" class="text-[10px] fantasy-font opacity-50 uppercase tracking-tighter mb-2 hover:opacity-100 transition-opacity">← Reselect Item</button>`;
            html += renderCustomizer();
        }
        
        container.innerHTML = `<div class="${selectedBaseItem ? '' : 'animate-flow'}">${html}</div>`;
    }

                    <label class="flex items-center gap-2 text-sm ledger-font cursor-pointer">
                        <input type="checkbox" onchange="toggleInnService('laundry')" ${innLaundry ? 'checked' : ''} class="accent-[#8b4513] w-4 h-4">

                    </label>
                    <div class="flex items-center justify-between mt-3 pt-3 border-t border-[#8b4513]/20">
                        <span class="text-sm ledger-font">Stabled Horses (+5cp / horse)</span>

    function renderCustomizer() {
        if (tradeMode === 'recraft' && selectedBaseItem.value !== undefined) {
            return `
                <div class="space-y-4 mt-2">
                    <h3 class="text-xl font-bold ledger-font ink-text">${selectedBaseItem.name}</h3>

                    <label class="fantasy-font text-[10px] uppercase opacity-60 block mb-1">Enrichment / Trim</label>
                    <select onchange="setOrigSecondary(this.value)" class="w-full bg-white/40 border-b-2 border-[#8b4513]/20 p-1 text-xs ledger-font font-bold outline-none">

                    <label class="fantasy-font text-[10px] uppercase opacity-60 block mb-1">Inlay</label>

                        <option value="">None</option>

            html += `</div>`;

            // --- TARGET STATE COLUMN ---
            html += `<div class="space-y-3 p-3 bg-green-900/5 rounded border border-green-900/10 shadow-inner">
                <h4 class="font-bold text-[10px] uppercase tracking-widest text-green-900/60 mb-2 border-b border-green-900/10 pb-1">Target Upgrade</h4>
                <div>
                    ${renderLabelWithProv('Target Core', 'primary')}
                    <select onchange="setPrimary(this.value)" class="w-full bg-white/40 border-b-2 border-[#8b4513]/20 p-1 text-xs ledger-font font-bold outline-none text-[#8b4513]">
                        <option value="">Select Target Core...</option>
                        ${primaryMats.map(m => `<option value="${m.id}" ${selectedPrimaryMat?.id === m.id ? 'selected' : ''}>${m.name}</option>`).join('')}
                    </select>
                </div>`;
            if (selectedPrimaryMat && selectedPrimaryMat.type !== 'fixed') {
                html += `<div>
                    <label id="target-quality-label" class="fantasy-font text-[10px] uppercase opacity-60 block mb-1">Quality (Q${itemQuality})</label>
                    <input type="range" min="1" max="${selectedPrimaryMat.type === 'tiered_bone' ? '5' : '10'}" value="${itemQuality}" oninput="setQuality(this.value)" class="w-full accent-[#8b4513]" />
                </div>`;
            }
            html += `<div>
                    ${renderLabelWithProv('Enrichment / Trim', 'secondary')}
                    <select onchange="setSecondary(this.value)" class="w-full bg-white/40 border-b-2 border-[#8b4513]/20 p-1 text-xs ledger-font font-bold outline-none text-[#8b4513]">
                        <option value="">None</option>
                        ${secondaryMats.map(m => `<option value="${m.id}" ${selectedSecondaryMat?.id === m.id ? 'selected' : ''}>${m.name}</option>`).join('')}
                    </select>
                </div>`;
            if (storeConditions.length > 0) {
                html += `<div>
                    <label class="fantasy-font text-[10px] uppercase opacity-60 block mb-1">Condition</label>
                    <select onchange="setCondition(this.value)" class="w-full bg-white/40 border-b-2 border-[#8b4513]/20 p-1 text-xs ledger-font font-bold outline-none text-[#8b4513]">
                        <option value="">Standard / Clean</option>
                        ${storeConditions.filter(m => m.id !== 'st_clean' && m.id !== 'st_fresh').map(m => `<option value="${m.id}" ${selectedCondition?.id === m.id ? 'selected' : ''}>${m.name.replace('Condition: ', '')}</option>`).join('')}
                    </select>
                </div>`;
            }
            if (canHaveInlay) {
                html += `<div>
                    ${renderLabelWithProv('Inlay Gem', 'inlay')}
                    <select onchange="setInlay(this.value)" class="w-full bg-white/40 border-b-2 border-[#8b4513]/20 p-1 text-xs ledger-font font-bold outline-none text-[#8b4513]">
                        <option value="">None</option>
                        ${INLAY_GEMS.map(g => `<option value="${g.id}" ${selectedInlay?.id === g.id ? 'selected' : ''}>${g.name} (+${formatCp(g.price)})</option>`).join('')}
                    </select>
                </div>`;
            }
            html += `</div></div>`;

        } else if (activeStoreId !== 'RESTAURANT' && activeStoreId !== 'GROCERY' && activeStoreId !== 'MINERALS' && selectedBaseItem.value === undefined) {
            html += `
                <div>
                    ${renderLabelWithProv('Primary Material / Core', 'primary')}
                    <select onchange="setPrimary(this.value)" class="w-full bg-white/40 border-b-2 border-[#8b4513]/20 p-2 text-sm ledger-font font-bold outline-none focus:border-[#8b4513]">
                        <option value="">Select Core...</option>
                        <option value="" disabled>────────────────</option>
                        ${primaryMats.map(m => `<option value="${m.id}" ${selectedPrimaryMat?.id === m.id ? 'selected' : ''}>${m.name}</option>`).join('')}
                    </select>
                </div>`;

            if (selectedPrimaryMat && selectedPrimaryMat.type !== 'fixed') {
                html += `
                <div>
                    <label id="quality-label" class="fantasy-font text-[10px] uppercase opacity-60 block mb-1">Quality Level (Q${itemQuality})</label>
                    <input type="range" min="1" max="${selectedPrimaryMat.type === 'tiered_bone' ? '5' : '10'}" value="${itemQuality}" oninput="setQuality(this.value)" class="w-full accent-[#8b4513]" />
                </div>`;
            }

            html += `
                <div>
                    ${renderLabelWithProv('Enrichment / Trim', 'secondary')}
                    <select onchange="setSecondary(this.value)" class="w-full bg-white/40 border-b-2 border-[#8b4513]/20 p-2 text-sm ledger-font font-bold outline-none focus:border-[#8b4513]">
                        <option value="">None</option>
                        <option value="" disabled>────────────────</option>
                        ${secondaryMats.map(m => `<option value="${m.id}" ${selectedSecondaryMat?.id === m.id ? 'selected' : ''}>${m.name}</option>`).join('')}
                    </select>
                </div>`;
        }

        if (storeConditions.length > 0) {
            html += `
            <div>
                <label class="fantasy-font text-[10px] uppercase opacity-60 block mb-1">Condition</label>
                <select onchange="setCondition(this.value)" class="w-full bg-white/40 border-b-2 border-[#8b4513]/20 p-2 text-sm ledger-font font-bold outline-none text-[#8b4513] focus:border-[#8b4513]">
                    <option value="">Standard / Clean</option>
                    <option value="" disabled>────────────────</option>
                    ${storeConditions.filter(m => m.id !== 'st_clean' && m.id !== 'st_fresh').map(m => `<option value="${m.id}" ${selectedCondition?.id === m.id ? 'selected' : ''}>${m.name.replace('Condition: ', '')}</option>`).join('')}
                </select>
            </div>`;
        }

        if (canHaveInlay && tradeMode !== 'recraft') {
            html += `
            <div>
                ${renderLabelWithProv('Gemstone Inlay (Optional)', 'inlay')}
                <select onchange="setInlay(this.value)" class="w-full bg-white/40 border-b-2 border-[#8b4513]/20 p-2 text-sm ledger-font font-bold outline-none text-[#8b4513] focus:border-[#8b4513]">
                    <option value="">No Inlay</option>
                    <option value="" disabled>────────────────</option>
                    ${INLAY_GEMS.map(g => `<option value="${g.id}" ${selectedInlay?.id === g.id ? 'selected' : ''}>${g.name} (+${formatCp(g.price)})</option>`).join('')}
                </select>
            </div>`;
        }

        html += `
            <div class="flex items-center bg-white/40 rounded p-2 border border-[#8b4513]/10">
                <button onclick="changeBatch(-1)" class="w-8 h-8 border border-[#8b4513]/20 rounded font-bold bg-white/50 hover:bg-[#8b4513]/10 transition-colors">-</button>
                <span id="batch-val" class="flex-1 text-center font-bold text-lg ledger-font">${batchQty}</span>
                <button onclick="changeBatch(1)" class="w-8 h-8 border border-[#8b4513]/20 rounded font-bold bg-white/50 hover:bg-[#8b4513]/10 transition-colors">+</button>
            </div>
            ${renderHaggleSection()}
            <button onclick="addItem()" class="w-full py-4 bg-[#8b4513] text-[#f4e4bc] rounded fantasy-font text-xs shadow-lg uppercase tracking-widest hover:bg-[#5d4037] transition-colors mt-4">${tradeMode === 'recraft' ? 'Authorize Recrafting' : 'Authorize Manifest'}</button>
        </div>`;

        return html;
    }

    /** HANDLERS **/

    // Search Handlers
    function handleSearch(query) {
        const resultsContainer = document.getElementById('search-results');
        if (!query.trim()) {
            resultsContainer.classList.add('hidden');
            return;
        }

        const lowerQuery = query.toLowerCase();
        
        // Find matching items from the global registry
        const results = ITEMS.filter(i => 
            i.name.toLowerCase().includes(lowerQuery) || 
            i.category.toLowerCase().includes(lowerQuery)
        ).slice(0, 10); 

        if (results.length === 0) {
            resultsContainer.innerHTML = `<div class="p-4 text-sm ledger-font opacity-60 italic text-center text-[#8b4513]">No wares found in the registry matching "${query}"...</div>`;
        } else {
            resultsContainer.innerHTML = results.map(i => `
                <div onclick="selectSearchResult('${i.id}')" class="p-3 border-b border-[#8b4513]/20 hover:bg-[#fff9e6] cursor-pointer flex justify-between items-center transition-colors">
                    <div>
                        <div class="font-bold ledger-font text-[#3e2723] text-lg leading-none">${i.name}</div>
                        <div class="text-[10px] fantasy-font uppercase tracking-widest text-[#8b4513] opacity-70 mt-1">${STORES[i.store].name} • ${i.category}</div>
                    </div>
                    <div class="text-xs ledger-font italic opacity-50">${i.value !== undefined ? formatCp(i.value) : i.weight + 'kg'}</div>
                </div>
            `).join('');
        }
        resultsContainer.classList.remove('hidden');
    }

    function selectSearchResult(itemId) {
        const item = ITEMS.find(i => i.id === itemId);
        if (item) {
            resetFlow();
            activeStoreId = item.store;
            currentCategory = item.category;
            selectedBaseItem = item;

            document.getElementById('item-search').value = '';
            document.getElementById('search-results').classList.add('hidden');

            renderStores();
            renderEntry();
        }
    }

    document.addEventListener('click', function(e) {
        const searchInput = document.getElementById('item-search');
        const resultsContainer = document.getElementById('search-results');
        if (e.target !== searchInput && !resultsContainer.contains(e.target)) {
            resultsContainer.classList.add('hidden');
        }
    });

    function setCat(c) { currentCategory = c; renderEntry(); }
    function setItem(id) { 
        selectedBaseItem = ITEMS.find(i => i.id === id); 
        selectedPrimaryMat = null; origPrimaryMat = null;
        selectedSecondaryMat = null; origSecondaryMat = null;
        selectedCondition = null; origCondition = null;
        selectedInlay = null; origInlay = null;
        itemQuality = 1; origItemQuality = 1;
        providedPrimary = false; providedSecondary = false; providedInlay = false;
        renderEntry(); 
    }
    
    function setPrimary(id) { selectedPrimaryMat = MATERIALS.find(m => m.id === id); renderEntry(); }
    function setSecondary(id) { selectedSecondaryMat = MATERIALS.find(m => m.id === id) || null; renderEntry(); }
    function setCondition(id) { selectedCondition = MATERIALS.find(m => m.id === id) || null; renderEntry(); }
    function setInlay(id) { selectedInlay = INLAY_GEMS.find(g => g.id === id) || null; renderEntry(); }
    function setOrigPrimary(id) { origPrimaryMat = MATERIALS.find(m => m.id === id); renderEntry(); }
    function setOrigSecondary(id) { origSecondaryMat = MATERIALS.find(m => m.id === id) || null; renderEntry(); }
    function setOrigCondition(id) { origCondition = MATERIALS.find(m => m.id === id) || null; renderEntry(); }
    function setOrigInlay(id) { origInlay = INLAY_GEMS.find(g => g.id === id) || null; renderEntry(); }

    function setRoom(id) { selectedRoom = ROOM_TYPES.find(r => r.id === id); renderEntry(); }
    
    function toggleProvided(type) {
        if (type === 'primary') providedPrimary = !providedPrimary;
        if (type === 'secondary') providedSecondary = !providedSecondary;
        if (type === 'inlay') providedInlay = !providedInlay;
        renderEntry();
    }
    
    // UI-only updates to prevent re-rendering elements while interacting
    function setQuality(val) { 
        itemQuality = parseInt(val); 
        const labelEl = document.getElementById(tradeMode === 'recraft' ? 'target-quality-label' : 'quality-label');
        if (labelEl) labelEl.textContent = `Quality (Q${itemQuality})`;
    }

    function setOrigQuality(val) { 
        origItemQuality = parseInt(val); 
        const labelEl = document.getElementById('orig-quality-label');
        if (labelEl) labelEl.textContent = `Quality (Q${origItemQuality})`;
    }
    
    function applyHaggle() {
        const rollInput = document.getElementById('haggle-roll');
        if (rollInput && rollInput.value !== '') {
            currentHaggleRoll = parseInt(rollInput.value);
        } else {
            currentHaggleRoll = null;
        }
        
        if (currentHaggleRoll === null || isNaN(currentHaggleRoll)) {
            currentMarkup = 0;
        } else {
            currentMarkup = (tradeMode === 'buyback') ? (currentHaggleRoll - 15) * 2.5 : (15 - currentHaggleRoll) * 2.5;
        }
        
        const labelEl = document.getElementById('markup-label');
        if (labelEl) {
            labelEl.textContent = (currentMarkup > 0 ? '+' : '') + currentMarkup + '%';
            
            let colorClass = '';
            if (currentMarkup !== 0) {
                const favorsPlayer = (tradeMode === 'buyback' && currentMarkup > 0) || (tradeMode !== 'buyback' && currentMarkup < 0);
                colorClass = favorsPlayer ? 'text-green-800' : 'text-red-800';
            }
            labelEl.className = colorClass + ' font-black';
        }
    }
    
    function changeBatch(d) { 
        batchQty = Math.max(1, batchQty + d); 
        const valEl = document.getElementById('batch-val');
        if (valEl) valEl.textContent = batchQty;
    }
    
    function changeParty(d) { 
        innPartySize = Math.max(1, innPartySize + d); 
        const valEl = document.getElementById('party-val');
        if (valEl) valEl.textContent = innPartySize;
    }
    
    function changeHorses(d) { 
        innHorses = Math.max(0, innHorses + d); 
        const valEl = document.getElementById('horses-val');
        if (valEl) valEl.textContent = innHorses;
    }

    function toggleInnService(s) {
        if(s === 'breakfast') innBreakfast = !innBreakfast;
        if(s === 'bath') innBath = !innBath;
        if(s === 'laundry') innLaundry = !innLaundry;
    }

    function addItem() {
        if (tradeMode === 'recraft') {
            const origMatConfigs = [
                { mat: origPrimaryMat || { name: '', base: 0, type: 'fixed' }, q: origItemQuality },
                { mat: origSecondaryMat, q: 1 },
                { mat: origCondition, q: 1 }
            ];
            const newMatConfigs = [
                { mat: selectedPrimaryMat || { name: '', base: 0, type: 'fixed' }, q: itemQuality },
                { mat: selectedSecondaryMat, q: 1 },
                { mat: selectedCondition, q: 1 }
            ];
            const flags = { primary: providedPrimary, secondary: providedSecondary, inlay: providedInlay };
            
            const brk = calculateRecraftBreakdown(selectedBaseItem, origMatConfigs, newMatConfigs, origInlay, selectedInlay, flags);
            
            if (brk.total === 0 && brk.labor === 0) {
                alert("No structural modifications selected for recrafting.");
                return;
            }

            let name = `[Recrafted] ${selectedBaseItem.name}`;
            if (selectedPrimaryMat) name += ` (${selectedPrimaryMat.name} Q${itemQuality}${providedPrimary ? ' Prov' : ''})`;
            if (selectedSecondaryMat) name += ` +${selectedSecondaryMat.name.split(' (')[0]}${providedSecondary ? ' Prov' : ''}`;
            if (selectedInlay) name += ` w/ ${selectedInlay.name}${providedInlay ? ' Prov' : ''}`;

            basket.push({
                id: Date.now(),
                name: name,
                price: brk.total,
                qty: batchQty,
                weight: selectedBaseItem.weight !== undefined ? selectedBaseItem.weight : 0.5,
                store: 'Imperial Recrafter'
            });

        } else {
            const matConfigs = [
                { mat: selectedPrimaryMat || { name: '', base: 0, type: 'fixed' }, q: itemQuality },
                { mat: selectedSecondaryMat, q: 1 },
                { mat: selectedCondition, q: 1 }
            ];
            const flags = { primary: providedPrimary, secondary: providedSecondary, inlay: providedInlay };

            const brk = calculateBreakdown(selectedBaseItem, matConfigs, selectedInlay, flags);
            
            let conditionPrefix = selectedCondition ? selectedCondition.name.replace('Condition: ', '') + ' ' : '';
            let primaryStr = selectedPrimaryMat ? `${selectedPrimaryMat.name}${providedPrimary && tradeMode !== 'buyback' ? ' (Prov)' : ''} ` : '';
            let qStr = (selectedPrimaryMat && selectedPrimaryMat.type !== 'fixed' && itemQuality > 1) ? `Q${itemQuality} ` : '';
            let secondaryStr = selectedSecondaryMat ? `(+ ${selectedSecondaryMat.name.split(' (')[0]}${providedSecondary && tradeMode !== 'buyback' ? ' Prov' : ''}) ` : '';
            let inlayStr = selectedInlay ? ` (w/ ${selectedInlay.name} Inlay${providedInlay && tradeMode !== 'buyback' ? ' Prov' : ''})` : '';
            
            let name = `${conditionPrefix}${primaryStr}${qStr}${secondaryStr}${selectedBaseItem.name}${inlayStr}`.trim();
            let itemWeight = selectedBaseItem.weight !== undefined ? selectedBaseItem.weight : 0.5;

            basket.push({
                id: Date.now(),
                name: name,
                price: brk.total,
                qty: batchQty,
                weight: itemWeight,
                store: STORES[activeStoreId].name
            });
        }
        
        resetFlow(); renderLedger(); renderEntry();
    }

    function addRes() {
        const roomPrice = selectedRoom.perPerson ? selectedRoom.price * innPartySize : selectedRoom.price;
        basket.push({ id: Date.now(), name: `Room: ${selectedRoom.name} (${innPartySize}p)`, price: applyMarkup(roomPrice), qty: 1, weight: 0, store: 'Imperial Inn' });
        
        if (innBreakfast) basket.push({ id: Date.now() + 1, name: `Breakfast (${innPartySize}p)`, price: applyMarkup(2 * innPartySize), qty: 1, weight: 0.2 * innPartySize, store: 'Imperial Inn' });
        if (innBath) basket.push({ id: Date.now() + 2, name: `Hot Bath (${innPartySize}p)`, price: applyMarkup(1 * innPartySize), qty: 1, weight: 0, store: 'Imperial Inn' });
        if (innLaundry) basket.push({ id: Date.now() + 3, name: `Laundry Service (${innPartySize}p)`, price: applyMarkup(3 * innPartySize), qty: 1, weight: 0, store: 'Imperial Inn' });
        if (innHorses > 0) basket.push({ id: Date.now() + 4, name: `Stabling (${innHorses} horses)`, price: applyMarkup(5 * innHorses), qty: 1, weight: 0, store: 'Imperial Inn' });

        innBreakfast = false; innBath = false; innLaundry = false; innHorses = 0; innPartySize = 1;
        currentMarkup = 0;
        renderLedger(); renderEntry();
    }

    function setTradeMode(mode) {
        tradeMode = mode;
        
        const activeClass = 'py-4 rounded font-bold fantasy-font text-[10px] bg-[#f4e4bc] text-[#2c1e1a] transition-all shadow-md';
        const inactiveClass = 'py-4 rounded font-bold fantasy-font text-[10px] text-[#f4e4bc]/40 transition-all hover:bg-[#f4e4bc]/10';

        document.getElementById('mode-sale').className = mode === 'sale' ? activeClass : inactiveClass;
        document.getElementById('mode-buy').className = mode === 'buyback' ? activeClass : inactiveClass;
        document.getElementById('mode-recraft').className = mode === 'recraft' ? activeClass : inactiveClass;
        
        applyHaggle();
        renderLedger();
        renderEntry();
    }

    function removeItem(id) { basket = basket.filter(i => i.id !== id); renderLedger(); }
    
    function clearLedger() { 
        basket = []; 
        cashProvided = { Platinum: 0, Gold: 0, Electrum: 0, Silver: 0, Copper: 0 }; 
        renderLedger(); 
    }
    
    function sealAndPrint() {
        if (basket.length > 0) {
            window.print();
        } else {
            alert("The Imperial Ledger is currently empty. There is no manifest to seal.");
        }
    }

    function updateWeight(w) {
        const label = document.getElementById('weight-label');
        const bar = document.getElementById('weight-bar');
        const warn = document.getElementById('encumbrance-warning');

        if (!label || !bar || !warn) return;

        label.textContent = `${w.toFixed(1)} kg`;
        
        const percent = Math.min(100, (w / 150) * 100);
        bar.style.width = `${percent}%`;

        if (w > 100) {
            warn.textContent = "CRITICAL: Multiple carts or draft animals required.";
            warn.className = "fantasy-font text-[10px] mt-1 italic text-red-600 font-bold";
        } else if (w > 60) {
            warn.textContent = "WARNING: Requires a horse or heavy carriage.";
            warn.className = "fantasy-font text-[10px] mt-1 italic text-orange-600 font-bold";
        } else if (w > 20) {
            warn.textContent = "NOTICE: Manifest is too heavy for one person to carry by hand.";
            warn.className = "fantasy-font text-[10px] mt-1 italic text-orange-800";
        } else if (w > 5) {
            warn.textContent = "Small pack or sack required for transport.";
            warn.className = "fantasy-font text-[10px] mt-1 italic text-[#8b4513] opacity-60";
        } else {
            warn.textContent = "Manifest is easily carried by hand.";
            warn.className = "fantasy-font text-[10px] mt-1 italic text-[#8b4513] opacity-60";
        }
    }

    function renderLedger() {
        const container = document.getElementById('ledger-items');
        if (basket.length === 0) {
            container.innerHTML = `<div class="h-full flex flex-col items-center justify-center opacity-10 py-32 text-center"><span class="fantasy-font text-xl tracking-widest uppercase">Registry Empty</span></div>`;
            document.getElementById('manifest-total').textContent = '0cp';
            renderCoins(0); updateChange(0); updateWeight(0); return;
        }

        container.innerHTML = basket.map(i => {
            const finalPrice = (tradeMode === 'buyback') ? Math.floor(i.price * 0.75) : i.price;
            return `
                <div class="border-l-2 border-[#8b4513]/20 pl-6 ml-2 relative animate-flow">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="fantasy-font text-lg uppercase tracking-tighter ink-text">${i.name}</h4>
                            <div class="flex gap-4 text-[9px] font-bold opacity-40 uppercase">
                                <span>${i.store}</span>
                                <span>Lot: ${i.qty}</span>
                                ${i.weight > 0 ? `<span>${(i.weight * i.qty).toFixed(1)}kg</span>` : ''}
                            </div>
                        </div>
                        <div class="text-right flex flex-col items-end">
                            <div class="fantasy-font text-2xl ink-text">${formatCp(finalPrice * i.qty)}</div>
                            <button onclick="removeItem(${i.id})" class="text-red-800 text-[10px] font-black uppercase opacity-40 hover:opacity-100 tracking-widest mt-1 transition-opacity no-print">Void Entry</button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        const total = basket.reduce((s, i) => s + ((tradeMode === 'buyback') ? Math.floor(i.price * 0.75) : i.price) * i.qty, 0);
        const totalWeight = basket.reduce((s, i) => s + (i.weight * i.qty), 0);
        
        document.getElementById('manifest-total').textContent = formatCp(total);
        updateWeight(totalWeight);
        renderCoins(total); 
        updateChange(total);
    }

    function renderCoins(total) {
        const container = document.getElementById('coin-entry');
        if (tradeMode === 'buyback' || total === 0) { container.innerHTML = ''; return; }
        container.innerHTML = COIN_TYPES.map(c => `
            <div class="flex flex-col items-center">
                <input type="number" min="0" value="${cashProvided[c.name] || ''}" oninput="updateCash('${c.name}', this.value)" class="w-12 xl:w-14 p-2 bg-white/40 border-2 border-[#8b4513]/20 rounded text-center ledger-font font-bold text-sm outline-none focus:border-[#8b4513] transition-colors" placeholder="0">
                <span class="text-[10px] font-black opacity-40 mt-1 uppercase tracking-widest">${c.name[0]}</span>
            </div>
        `).join('');
    }

    function updateCash(coin, val) {
        cashProvided[coin] = parseInt(val) || 0;
        const total = basket.reduce((s, i) => s + ((tradeMode === 'buyback') ? Math.floor(i.price * 0.75) : i.price) * i.qty, 0);
        updateChange(total);
    }

    function updateChange(bill) {
        const container = document.getElementById('change-container');
        if (tradeMode === 'buyback' || bill === 0) { container.classList.add('hidden'); return; }
        
        const tendered = Object.entries(cashProvided).reduce((s, [name, qty]) => s + (qty * COIN_TYPES.find(c => c.name === name).value), 0);
        const change = tendered - bill;
        
        if (change > 0) {
            container.classList.remove('hidden');
            document.getElementById('change-text').textContent = formatCp(change);
            let rem = change;
            document.getElementById('change-coins').innerHTML = COIN_TYPES.map(c => {
                const count = Math.floor(rem / c.value); rem %= c.value;
                return count > 0 ? `<div class="px-2 py-1 rounded-full text-[10px] font-black uppercase ${c.color} shadow-sm">x${count} ${c.name}</div>` : '';
            }).join('');
        } else {
            container.classList.add('hidden');
        }
    }

    // INIT
    renderStores(); renderEntry(); renderLedger();
</script>
</body>
</html>
